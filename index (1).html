<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>官方网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #fff; }
        .loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #fff; color: #666;
        }
        iframe {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: none; display: block;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">加载中...</div>
    <iframe id="embeddedPage" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

    <script>
        // 1. 微信兼容：URL-Safe Base64 解码（处理 +/= 被转义）
        function safeBase64Decode(str) {
            try {
                // 修复微信转义：- → +  _ → /  补全=
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                // iOS 微信兼容解码
                return decodeURIComponent(escape(atob(str)));
            } catch (e) {
                console.error('解码失败', e);
                return '';
            }
        }

        // 2. 获取参数
        function getQueryParam(key) {
            return new URLSearchParams(location.search).get(key) || '';
        }

        // 3. 微信主逻辑（DOM 就绪后执行）
        window.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            const iframe = document.getElementById('embeddedPage');
            const encoded = getQueryParam('fh');

            if (!encoded) {
                loading.textContent = '缺少参数 fh';
                return;
            }

            const url = safeBase64Decode(encoded);

            // 已移除 HTTP/HTTPS 协议校验，任意链接直接加载

            // 微信延迟赋值，避免白屏/不触发onload
            setTimeout(() => {
                iframe.src = url;
                // 加载成功/失败 都关闭loading
                iframe.onload = iframe.onerror = () => {
                    loading.style.display = 'none';
                };
                // 超时兜底（微信偶尔不触发onload）
                setTimeout(() => loading.style.display = 'none', 5000);
            }, 150);
        });
    </script>
</body>
</html>
